<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Geschützter Entwurf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF1F0;--sheet:#F8F9F8;--ink:#14232F;--ink-soft:#44535D;--rule:#C3CCCD;--blue:#0095CD;--blue-ink:#00709B;--orange:#FF9933;--error:#B3261E}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px 16px;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.55;border-top:4px solid var(--orange);
  background-image:linear-gradient(rgba(20,35,47,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(20,35,47,.05) 1px,transparent 1px);background-size:25px 25px}
.gate{width:100%;max-width:440px;background:var(--sheet);border:1.5px solid var(--ink);padding:clamp(24px,5vw,40px)}
h1{margin:0;font-stretch:125%;font-weight:800;font-size:clamp(1.6rem,5vw,2.1rem);line-height:1.05;letter-spacing:-.01em}
p{margin:14px 0 0;color:var(--ink-soft)}
label{display:block;margin-top:26px;font-weight:600;font-size:.95rem}
input{display:block;width:100%;margin-top:8px;min-height:50px;padding:0 14px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;font:inherit;font-size:16px;color:var(--ink)}
input[aria-invalid=true]{border-color:var(--error)}
button{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:14px;border:1.5px solid var(--ink);border-radius:4px;background:var(--ink);color:var(--sheet);font:inherit;font-weight:600;cursor:pointer;transition:background-color .2s}
button:hover{background:var(--blue-ink);border-color:var(--blue-ink)}
button:disabled{opacity:.7;cursor:progress}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.error{min-height:1.55em;margin-top:12px;color:var(--error);font-weight:600;font-size:.95rem}
</style>
</head>
<body>
<main class="gate">
  <h1>Entwurf ansehen</h1>
  <p>Diese Seite ist ein vertraulicher Entwurf. Bitte geben Sie das Passwort ein, das Sie erhalten haben.</p>
  <form id="f" novalidate>
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required aria-describedby="err">
    <button id="go" type="submit">Entwurf öffnen</button>
    <p class="error" id="err" role="alert"></p>
  </form>
</main>

  const ITER = 600000, MARKER = "<!--tts-ok-->", KEY = "tts-entwurf-key";
  const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const data = bytes(PAYLOAD), salt = data.slice(8, 16), body = data.slice(16);
  const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err');

  async function derive(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, 384));
  }
  async function open(bits) {
    const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32, 48) }, key, body);
    const html = new TextDecoder().decode(plain);
    if (!html.startsWith(MARKER)) throw new Error('wrong password');
    try { sessionStorage.setItem(KEY, btoa(String.fromCharCode(...bits))); } catch (e) {}
    document.open(); document.write(html.slice(MARKER.length)); document.close();
  }

  try {
    const saved = sessionStorage.getItem(KEY);
    if (saved) open(bytes(saved)).catch(() => { try { sessionStorage.removeItem(KEY); } catch (e) {} });
  } catch (e) {}

  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (!pw.value) { err.textContent = 'Bitte geben Sie das Passwort ein.'; pw.setAttribute('aria-invalid', 'true'); pw.focus(); return; }
    go.disabled = true; go.textContent = 'Wird geöffnet …'; err.textContent = '';
    try { await open(await derive(pw.value)); }
    catch (x) {
      go.disabled = false; go.textContent = 'Entwurf öffnen';
      err.textContent = 'Das Passwort stimmt nicht. Bitte prüfen Sie die Schreibweise.';
      pw.setAttribute('aria-invalid', 'true'); pw.select();
    }
  });
  pw.addEventListener('input', () => { pw.removeAttribute('aria-invalid'); err.textContent = ''; });
